<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EThack · S&amp;P 500 Impact</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0b0b'/><rect x='7' y='16' width='4' height='9' rx='2' fill='%232a78d6'/><rect x='14' y='11' width='4' height='14' rx='2' fill='%23eb6834'/><rect x='21' y='7' width='4' height='18' rx='2' fill='%231baf7a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" id="progress"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">EThack</span>
      <span class="brand-sep">/</span>
      <span class="brand-title">S&amp;P 500 Impact</span>
    </div>

    <nav class="nav" id="nav">
      <button data-view="ranking" class="active">Ranking</button>
      <button data-view="sectors">Sectors</button>
      <button data-view="indicators">Indicators</button>
      <button data-view="portfolio">Portfolio</button>
      <span class="nav-divider"></span>
      <button data-view="workspace">Workspace <span class="dot" id="ws-dot" hidden></span></button>
    </nav>

    <div class="top-actions">
      <div class="segmented small" id="source">
        <button data-source="real">Live data</button>
        <button data-source="demo">Demo</button>
      </div>
      <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="demo-banner" hidden>
    <strong>Demo data</strong> — random companies (DEMO001…) and random numbers to try the tool. Nothing here is a result.
  </div>

  <div class="shell" id="shell">
    <aside class="panel" id="panel">
      <button class="panel-toggle" id="panel-toggle" aria-expanded="false">
        <span><span class="eyebrow">Priorities</span><span class="panel-summary" id="panel-summary"></span></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="panel-inner">
        <section>
          <label class="eyebrow" for="profile-select">Profile</label>
          <div class="select-wrap">
            <select id="profile-select"></select>
          </div>
          <p class="muted small" id="profile-desc"></p>
        </section>

        <section>
          <div class="section-head">
            <span class="eyebrow">Category weight</span>
          </div>
          <div class="split" id="split"></div>
          <div id="category-controls"></div>
        </section>

        <section>
          <div class="section-head">
            <span class="eyebrow">Indicators</span>
            <span class="muted small" id="indicator-count"></span>
          </div>
          <div id="indicator-controls"></div>
        </section>

        <section>
          <span class="eyebrow">Rules</span>
          <label class="switch-row">
            <span>
              <span class="label">Compare within sector</span>
              <span class="muted small">Rank each company against its own industry</span>
            </span>
            <input type="checkbox" class="switch" id="sector-relative">
          </label>
          <div class="slider-row">
            <div class="slider-head">
              <span class="label">Minimum data coverage</span>
              <span class="value" id="min-share-value"></span>
            </div>
            <input type="range" min="0" max="1" step="0.05" id="min-share">
          </div>
        </section>

        <section class="save">
          <div class="save-row">
            <input type="text" id="save-name" placeholder="Name this profile">
            <button class="btn" id="save-btn">Save</button>
          </div>
          <p class="muted small" id="save-msg"></p>
        </section>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <div class="console" id="console" hidden>
    <div class="console-head">
      <div>
        <span class="status-dot" id="console-dot"></span>
        <strong id="console-title"></strong>
        <code id="console-cmd"></code>
      </div>
      <button class="icon-btn" id="console-close" aria-label="Close">✕</button>
    </div>
    <pre id="console-out"></pre>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
