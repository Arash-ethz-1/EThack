<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&amp;P 500 Impact</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="title">
      <span class="label">EThack · S&amp;P 500</span>
      <h1>S&amp;P 500 Impact</h1>
      <div class="motto">Every number has a source.</div>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-ranking" aria-selected="true" data-view="ranking">Ranking</button>
      <button type="button" role="tab" id="tab-portfolio" aria-selected="false" data-view="portfolio">Portfolio</button>
      <button type="button" role="tab" id="tab-evidence" aria-selected="false" data-view="evidence">Evidence</button>
    </nav>
    <label class="prof"><span class="label">Profile</span><select id="profile"></select></label>
  </div>
</header>

<main class="wrap">
  <section id="view-ranking">
    <div class="lede">
      <div>
        <h2>Sustainability impact of the S&amp;P 500, traced to the source.</h2>
        <p id="summary"></p>
      </div>
      <div class="tools">
        <input type="search" id="q" placeholder="Company or ticker" aria-label="Search company">
        <select id="sector" aria-label="Sector"></select>
        <button type="button" class="btn" id="wbtn" aria-expanded="false" aria-controls="weights">Adjust weights</button>
      </div>
    </div>
    <div class="weights" id="weights" hidden></div>
    <div class="table-wrap">
      <table class="rank">
        <thead><tr><th>#</th><th>Company</th><th>Sector</th><th>Indicator fingerprint</th><th class="r">Econ.</th><th class="r">Social</th><th class="r">Env.</th><th class="r">Total</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="legend" id="legend"></p>
    <button type="button" class="btn more" id="more" hidden></button>
  </section>

  <section id="view-portfolio" hidden></section>

  <section id="view-evidence" hidden>
    <div class="ev">
      <aside class="index">
        <h2>Evidence</h2>
        <p>A score is only worth something if it means something. Three ways to test ours.</p>
        <ol id="index"></ol>
      </aside>
      <article class="exhibit" id="exhibit"></article>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Company detail"></aside>

<script src="app.js"></script>
<script src="portfolio.js"></script>
<script src="evidence.js"></script>
</body>
</html>
